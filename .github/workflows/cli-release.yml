name: Release GPBot CLI

on:
  push:
    tags:
      - "gpbot-cli-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CLI package
        run: |
          python -m pip install --upgrade pip build
          python -m build clients/python
          cd clients/python/dist
          shasum -a 256 * > SHA256SUMS

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/gpbot-cli-release-smoke
          /tmp/gpbot-cli-release-smoke/bin/python -m pip install clients/python/dist/gpbot_cli-*.whl
          /tmp/gpbot-cli-release-smoke/bin/gpbot --help
          /tmp/gpbot-cli-release-smoke/bin/gpbot login --help

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpbot-cli-dist
          path: clients/python/dist/*

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gpbot-cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/python/dist/*
            clients/install/install.sh

  build-zipapp:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x86_64
          - runner: macos-13
            artifact: macos-x86_64
          - runner: macos-14
            artifact: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build self-contained CLI zipapp
        run: |
          python -m pip install --upgrade pip shiv
          mkdir -p clients/python/dist
          shiv --compressed --reproducible \
            --console-script gpbot \
            --output-file "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz" \
            clients/python
          chmod +x "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz"
          shasum -a 256 "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz" \
            > "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz.sha256"

      - name: Smoke test zipapp
        run: |
          "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz" --help
          "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz" login --help
          "clients/python/dist/gpbot-${{ matrix.artifact }}.pyz" mcp serve --help

      - name: Upload zipapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpbot-${{ matrix.artifact }}-pyz
          path: |
            clients/python/dist/gpbot-${{ matrix.artifact }}.pyz
            clients/python/dist/gpbot-${{ matrix.artifact }}.pyz.sha256

      - name: Attach zipapp to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gpbot-cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/python/dist/gpbot-${{ matrix.artifact }}.pyz
            clients/python/dist/gpbot-${{ matrix.artifact }}.pyz.sha256

  publish-pypi:
    needs: [build, build-zipapp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/gpbot-cli-v') && vars.PUBLISH_PYPI == '1'
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: gpbot-cli-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: [build, build-zipapp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/gpbot-cli-v') && vars.PUBLISH_NPM == '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm installer package
        working-directory: clients/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
